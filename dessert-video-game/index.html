<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7778">
<title>Sweet Street — Dessert Rush</title>
<style>
:root{--ink:#17484a;--teal:#0a7779;--pink:#fb5b91;--cream:#fff8df}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink)}body{background:#0b7778}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.game{position:relative;isolation:isolate;display:flex;flex-direction:column;max-width:540px;min-height:100svh;margin:auto;overflow:hidden;background:linear-gradient(#9be9e5 0 27%,#e5f9df 27% 42%,#ffecc1 42% 100%);box-shadow:0 20px 70px #063b43}
@media(min-width:600px){.game{min-height:850px;max-height:980px;margin:18px auto;border:7px solid #fff4cf;border-radius:30px}}
.sky{position:absolute;z-index:-1;inset:0 0 auto;height:205px;overflow:hidden;background:linear-gradient(#8fe4e6,#c5f4df)}.sun{position:absolute;right:12%;top:27px;width:90px;height:90px;border-radius:50%;background:#fff1a4;box-shadow:0 0 0 16px #fff1a43d,0 0 0 36px #fff1a420}.cloud{position:absolute;left:-18px;top:45px;width:100px;height:30px;border-radius:30px;background:#fffdf0}.cloud:before,.cloud:after{content:"";position:absolute;bottom:6px;border-radius:50%;background:#fffdf0}.cloud:before{left:15px;width:45px;height:45px}.cloud:after{left:43px;width:55px;height:55px}.cloud.two{left:auto;right:-20px;top:125px;transform:scale(.7)}
.shop{position:absolute;left:50%;top:101px;width:250px;height:105px;transform:translateX(-50%);border:5px solid #14545b;border-radius:17px 17px 3px 3px;background:#f6d69a;box-shadow:6px 7px #157a7c35}.shop:before{content:"";position:absolute;inset:24px 15px 0;border:5px solid #2f777c;border-bottom:0;border-radius:12px 12px 0 0;background:repeating-linear-gradient(90deg,#9fe4dc 0 33px,#82d2ce 33px 37px)}.shop:after{content:"";position:absolute;bottom:0;left:95px;width:50px;height:65px;border:5px solid #2f777c;border-bottom:0;border-radius:15px 15px 0 0;background:#fff2c7}.awning{position:absolute;z-index:1;top:-21px;left:-19px;right:-19px;height:50px;border:5px solid #14545b;border-radius:15px 15px 20px 20px;background:repeating-linear-gradient(90deg,#ff799d 0 30px,#fff2d6 30px 60px);box-shadow:0 7px #c95c75}.sign{position:absolute;z-index:2;top:-70px;left:35px;right:35px;padding:6px 2px;border:4px solid #17595c;border-radius:12px;background:#ffdc70;text-align:center;font-size:16px;font-weight:1000;letter-spacing:.04em;transform:rotate(-3deg);box-shadow:3px 5px #0c67703d}.plant{position:absolute;bottom:0;font-size:31px}.plant.left{left:-36px}.plant.right{right:-37px}
.hud{z-index:1;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:63px;padding:calc(10px + env(safe-area-inset-top)) 11px 0}.brand{font-size:13px;line-height:.9;font-weight:1000;text-transform:uppercase;color:#075d62}.brand strong{display:block;font-size:23px;color:#f33e7e;letter-spacing:-.05em;text-shadow:1px 2px #fff}.stats{display:flex;gap:4px}.stat{min-width:54px;padding:4px 5px;border:3px solid #247477;border-radius:12px;background:#fff9e6;text-align:center;box-shadow:0 4px #0f73763d}.stat small{display:block;font-size:9px;font-weight:1000;text-transform:uppercase}.stat b{font-size:16px}.stat.heart b{color:#e64274}.spacer{height:115px;flex:none}
.play{z-index:2;flex:1;display:flex;flex-direction:column;gap:7px;min-height:0;padding:0 10px calc(9px + env(safe-area-inset-bottom))}.rowtitle{display:flex;justify-content:space-between;padding:0 5px;font-size:11px;font-weight:1000;text-transform:uppercase;letter-spacing:.1em;color:#116468}.rush{color:#e33b76;animation:pulse 1s infinite}.orders{display:flex;gap:7px;min-height:109px}.order{flex:1;min-width:0;padding:7px 5px;border:3px solid #24797c;border-radius:17px;background:#fffbeb;color:var(--ink);text-align:center;box-shadow:0 5px #347f80a6;transition:transform .15s}.order.selected{transform:translateY(-4px);border-color:#f75d90;background:#fff1dd;box-shadow:0 8px #e07491a6}.face{font-size:26px;line-height:1}.want{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:1000}.recipe{font-size:19px;line-height:1.25}.meter{height:9px;margin-top:4px;border:2px solid #246f70;border-radius:20px;background:#ffd8cc;overflow:hidden}.meter span{display:block;height:100%;background:#51cba4}.order.urgent .meter span{background:#f66374}.empty{width:100%;display:grid;place-items:center;padding:12px;border:3px dashed #6db7ab;border-radius:17px;background:#fffde5b0;text-align:center;font-weight:900;font-size:13px}
.counter{display:flex;align-items:center;gap:12px;min-height:139px;padding:10px 13px;border:5px solid #9b5c47;border-radius:24px;background:linear-gradient(145deg,#ffdaa1,#ffbd82);box-shadow:0 8px #7c483b,0 15px 20px #6e423b4d}.plate{display:grid;place-items:center;flex:none;width:112px;height:112px;border:4px solid #925e54;border-radius:50%;background:radial-gradient(#fffefa 0 49%,#f69eac 50% 59%,#fff6e2 60%);box-shadow:inset 0 5px 8px #8c655536,0 6px #a97666}.dessert{font-size:53px;filter:drop-shadow(0 5px 2px #64433144);animation:pop .24s}.copy{flex:1;min-width:0}.copy small{font-size:9px;font-weight:1000;letter-spacing:.15em;text-transform:uppercase;color:#925449}.copy h2{margin:3px 0;font-size:19px;line-height:1.05;color:#68463e}.copy p{min-height:28px;margin:0;font-size:11px;line-height:1.2;font-weight:800;color:#6f5049}.serve{width:100%;margin-top:7px;padding:10px 4px;border:3px solid #176d69;border-radius:13px;background:#2ad0a2;color:#063d44;font-weight:1000;text-transform:uppercase;box-shadow:0 5px #0a896f}.serve:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px #0a896f}.serve:disabled{opacity:.5}.label{padding:1px 4px 0;color:#875547;font-size:10px;font-weight:1000;text-transform:uppercase;letter-spacing:.12em}.ingredients{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.ingredient{height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:3px solid #815947;border-radius:15px;background:#fff9e5;color:#593e39;box-shadow:0 5px #a47660}.ingredient:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px #a47660}.ingredient.chosen{background:#b5f9e5;border-color:#068c7e}.ingredient:disabled{opacity:.6}.ingredient .icon{font-size:29px;line-height:1}.ingredient .name{font-size:10px;font-weight:1000}.footer{display:flex;align-items:center;gap:6px;padding:3px 2px}.combo{color:#eb4179;font-size:11px;font-weight:1000}.progress{height:10px;flex:1;overflow:hidden;border:2px solid #518276;border-radius:20px;background:#ffe2b9}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,#f86193,#ffca4d)}.mute{padding:5px 7px;border:2px solid #2b7e7b;border-radius:10px;background:#fffbe8;font-size:14px}.hint{font-size:10px;font-weight:750;color:#8b6854;text-align:center}
.overlay{position:absolute;z-index:10;inset:0;display:grid;place-items:center;padding:20px 18px;background:#073f49b8;backdrop-filter:blur(6px)}.overlay.hidden{display:none}.modal{width:min(100%,390px);padding:21px;border:5px solid #195e60;border-radius:27px;background:linear-gradient(145deg,#fffcea,#ffdfb3);text-align:center;box-shadow:0 12px #0b5052,0 24px 45px #062d3c90}.mascot{font-size:66px;line-height:1.1}.eyebrow{display:block;margin:6px 0;color:#087c78;font-size:11px;font-weight:1000;text-transform:uppercase;letter-spacing:.2em}.modal h1{margin:0;color:#f34f84;font-size:38px;line-height:.98;letter-spacing:-.06em;text-shadow:2px 3px #fff,3px 5px #155d60}.modal p{max-width:300px;margin:15px auto;font-size:14px;line-height:1.42;font-weight:750}.primary{width:100%;padding:13px;border:3px solid #0c5e63;border-radius:16px;background:linear-gradient(#ff7ca4,#fa4c87);color:white;font-size:17px;font-weight:1000;text-transform:uppercase;text-shadow:0 2px #bd3162;box-shadow:0 6px #0c5e63}.primary:active{transform:translateY(5px);box-shadow:0 1px #0c5e63}.upgrades{display:grid;gap:8px;margin:15px 0}.upgrade{padding:10px 12px;border:3px solid #196b6a;border-radius:14px;background:#fffefa;color:#174e50;text-align:left;box-shadow:0 4px #478e8a66}.upgrade strong,.upgrade span{display:block}.upgrade strong{font-size:15px}.upgrade span{font-size:11px}.toast{position:absolute;z-index:5;top:48%;left:50%;padding:10px 14px;transform:translate(-50%,-50%);border:3px solid #176868;border-radius:15px;background:#fff9dc;color:#11676a;font-size:16px;font-weight:1000;white-space:nowrap;box-shadow:0 8px 20px #165c5c55;pointer-events:none;animation:toast .85s forwards}.confetti{position:absolute;z-index:4;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:44%;left:50%;width:9px;height:16px;border-radius:2px;background:var(--c);animation:fly .7s ease-out forwards}.shake{animation:shake .3s}@keyframes pop{from{transform:scale(.4) rotate(-15deg)}}@keyframes pulse{50%{transform:scale(1.12)}}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}@keyframes toast{0%{opacity:0;transform:translate(-50%,-25%) scale(.6)}20%,75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-85%)}}@keyframes fly{to{opacity:0;left:calc(50% + var(--x));top:calc(44% + var(--y));transform:rotate(200deg)}}@media(max-height:760px){.sky{height:165px}.shop{top:77px;transform:translateX(-50%) scale(.82)}.spacer{height:88px}.play{gap:5px}.orders{min-height:95px}.face{font-size:22px}.counter{min-height:115px;padding:7px 10px}.plate{width:93px;height:93px}.dessert{font-size:47px}.ingredient{height:62px}}
@media(max-height:620px){.sky{height:130px}.shop{top:62px;transform:translateX(-50%) scale(.68)}.spacer{height:49px}.play{gap:3px}.orders{min-height:78px}.order{padding:3px}.face{font-size:19px}.recipe{font-size:16px}.counter{min-height:96px;padding:5px 8px}.plate{width:77px;height:77px}.dessert{font-size:39px}.copy h2{font-size:16px}.copy p{min-height:20px;font-size:10px}.serve{padding:6px}.ingredient{height:50px}.ingredient .icon{font-size:22px}.ingredient .name{font-size:9px}.hint{display:none}}
.order.vip{border-color:#e6a739;background:#fff4cf}.vipmark{position:absolute;margin-left:-5px;color:#edaa29;font-size:16px;text-shadow:1px 2px #fff}.order.vip .want{color:#9c5e08}.game.fever .counter{box-shadow:0 8px #7c483b,0 0 0 4px #ffcc4d,0 0 24px #ffca4daa}.game.fever .progress span{background:linear-gradient(90deg,#ff9c29,#f54d84)}.secondary{display:block;width:100%;margin-top:12px;padding:10px;border:3px solid #176d69;border-radius:14px;background:#fff9de;color:#155d60;font-size:14px;font-weight:1000}.record{margin:8px auto!important;font-size:12px!important;color:#8a5e49}.modal .upgrades{max-height:42svh;overflow:auto}.order .recipe{white-space:nowrap}.stat b{white-space:nowrap}
@media(max-width:360px){.hud{padding-left:6px;padding-right:6px}.stats{gap:2px}.stat{min-width:49px;padding:4px 2px}.stat b{font-size:14px}.brand strong{font-size:19px}.play{padding-left:7px;padding-right:7px}.orders{gap:4px}.order{padding-left:2px;padding-right:2px}.order .recipe{font-size:16px}}
</style>
</head>
<body>
<div class="game" id="game">
  <div class="sky"><div class="sun"></div><div class="cloud"></div><div class="cloud two"></div><div class="shop"><div class="awning"></div><div class="sign">SWEET STREET</div><div class="plant left">🌿</div><div class="plant right">🌼</div></div></div>
  <header class="hud"><div class="brand">Dessert<strong>RUSH!</strong></div><div class="stats"><div class="stat"><small>Round</small><b id="level">1 / 4</b></div><div class="stat"><small>Time</small><b id="time">45</b></div><div class="stat heart"><small>Hearts</small><b id="hearts">♥♥♥</b></div><div class="stat"><small>Score</small><b id="score">0</b></div></div></header>
  <div class="spacer"></div>
  <main class="play">
    <div class="rowtitle"><span id="round">Morning crowd</span><span id="rush">0 / 4 served</span></div>
    <div class="orders" id="orders"></div>
    <div class="counter" id="counter"><div class="plate"><div class="dessert" id="dessert">🍽️</div></div><div class="copy"><small>Your prep counter</small><h2 id="plate-title">Ready to scoop</h2><p id="plate-hint">Choose a customer, then build their treat.</p><button class="serve" id="serve" disabled>Serve dessert →</button></div></div>
    <div class="label">1 · Choose a scoop</div><div class="ingredients" id="bases"></div>
    <div class="label">2 · Add a topping</div><div class="ingredients" id="tops"></div>
    <div class="footer"><span class="combo" id="combo">✦ Make a combo!</span><div class="progress" aria-label="Fever meter"><span id="progress"></span></div><button class="mute" id="mute" aria-label="Toggle sound">🔊</button></div>
    <div class="hint" id="hint">Tap an order • Match the scoop + topping • Serve!</div>
  </main>
  <div class="confetti" id="confetti"></div>
  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
</div>
<script src="game.js"></script>
</body>
</html>
